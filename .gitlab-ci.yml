# .gitlab-ci.yml - GitLab CI for the STM32 Rust-on-FreeRTOS application.
#
# Mirrors ./Jenkinsfile: Checkout -> Toolchain -> Build -> Static analysis -> Format -> Boot
# contract -> Image -> Package -> Release (tags).
#
# Builds run through scripts/docker-dev.sh, so the runner only needs
# Docker (DinD) and make. The image is built from docker/Dockerfile on
# first use and then reused by the runner's Docker cache.
#
# Set the CI/CD variable GITHUB_RELEASE_TOKEN (masked, protected) to
# publish a v<version> tag build as a GitHub release.

stages:
  - build
  - test
  - analyse
  - package
  - release

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

variables:
  GIT_DEPTH: "0"
  BUILD_TYPE: "Release"
  STM32_IMAGE: "stm32-dev-rust-freertos:latest"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  BASE_IMAGE: "stm32-dev:latest"

default:
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  interruptible: true
  before_script:
    - apk add --no-cache bash build-base git make python3 py3-pip
    - docker version
    - |
      if [ -n "${BASE_IMAGE:-}" ] && ! docker image inspect "$BASE_IMAGE" >/dev/null 2>&1; then
        echo "Building $BASE_IMAGE"
        docker build -t "$BASE_IMAGE" -f docker/Dockerfile.base docker
      fi
      if ! docker image inspect "$STM32_IMAGE" >/dev/null 2>&1; then
        echo "Building $STM32_IMAGE"
        make image
      fi

build:
  stage: build
  script:
    - |
      make build BUILD_TYPE="$BUILD_TYPE"
  artifacts:
    paths:
      - build/
    expire_in: 30 days

analyse:
  stage: analyse
  needs: [build]
  rules:
    - if: '$RUN_LINT == "false"'
      when: never
    - when: on_success
  script:
    - |
      make lint

format:
  stage: analyse
  needs: [build]
  script:
    - |
      scripts/docker-dev.sh run env CARGO_HOME=/work/.cargo-home cargo fmt --all -- --check
  allow_failure: true

boot-contract:
  stage: test
  needs: [build]
  script:
    - |
      python3 - <<'PY'
      from pathlib import Path

      expected = {
          "APP_SLOT_BASE": 0x0800C000,
          "APP_SLOT_SIZE": 0x000F4000,
          "APP_META_A_ADDR": 0x08008000,
          "APP_META_B_ADDR": 0x08108000,
          "APP_META_VERIFIED_OFFSET": 0x100,
          "APP_META_ACTIVATED_OFFSET": 0x120,
          "APP_META_CONFIRMED_OFFSET": 0x140,
          "APP_META_REJECTED_OFFSET": 0x160,
      }

      defines = {}
      for line in Path("platform/boot/boot_contract.h").read_text(encoding="utf-8").splitlines():
          parts = line.split()
          if len(parts) >= 3 and parts[0] == "#define":
              defines[parts[1]] = parts[2]

      for name, want in expected.items():
          if name not in defines:
              raise SystemExit(f"boot contract: {name} is missing from platform/boot/boot_contract.h")
          raw = defines[name].rstrip("ULul").rstrip("ULul")
          got = int(raw, 16)
          if got != want:
              raise SystemExit(f"boot contract: {name} is 0x{got:08X}, expected 0x{want:08X}")

      print("boot contract: slot, metadata and record offsets match the BOOT layout")
      PY

image:
  stage: test
  needs: [build]
  script:
    - |
      make size
    - |
      python3 - <<'PY'
      import struct
      import zlib
      from pathlib import Path

      version = {}
      for line in Path("VERSION").read_text(encoding="utf-8").splitlines():
          if "=" in line:
              key, _, value = line.partition("=")
              version[key.strip()] = value.strip()
      want = ((int(version["VERSION_MAJOR"]) << 24) |
              (int(version["VERSION_MINOR"]) << 16) |
              int(version["PATCHLEVEL"]))

      path = Path("build/rust-freertos-app.img")
      data = path.read_bytes()
      header = struct.unpack_from("<IHHIIIIIII", data, 0)
      magic, hver, hsize, itype, ver, isize, icrc, load, entry, _ts = header
      assert magic == 0x48574249, "bad image magic"
      assert hver == 1, f"unexpected header version {hver}"
      assert hsize == 256, f"unexpected header size {hsize}"
      assert itype == 1, f"unexpected image type {itype}"
      assert ver == want, f"image version 0x{ver:08X} does not match VERSION 0x{want:08X}"
      assert load == 0x0800C000, f"image loads at 0x{load:08X}, expected 0x0800C000"
      assert len(data) == hsize + isize, "image size does not match the header"
      assert zlib.crc32(data[hsize:]) & 0xFFFFFFFF == icrc, "image CRC32 mismatch"
      sp = struct.unpack_from("<I", data, hsize)[0]
      assert 0x20000000 < sp <= 0x20080000, "initial stack pointer is outside internal RAM"
      entry_ok = entry & 1 and 0x0800C000 <= (entry & ~1) < 0x0800C000 + 0x000F4000
      assert entry_ok, "reset vector is outside the slot"
      print(f"image: {path} v{(ver >> 24) & 0xFF}.{(ver >> 16) & 0xFF}.{ver & 0xFF} "
            f"({isize} bytes payload, entry 0x{entry:08X})")
      PY

package:
  stage: package
  needs: [build]
  script:
    - |
      python3 ci/package.py --name app-rust-freertos --version "$(ci/version.sh)" build/rust-freertos-app.elf build/rust-freertos-app.bin build/rust-freertos-app.hex build/rust-freertos-app.map build/rust-freertos-app.img README.md LICENSE
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

release:
  stage: release
  needs: [package]
  rules:
    - if: '$CI_COMMIT_TAG && $GITHUB_RELEASE_TOKEN'
  script:
    - |
      GITHUB_TOKEN="$GITHUB_RELEASE_TOKEN" python3 ci/github_release.py --tag "$CI_COMMIT_TAG" --version "$(ci/version.sh)" dist/*
